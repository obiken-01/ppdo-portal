# Browser tests against UAT (PPDO-258).
#
# Manual only, on purpose: UAT is shared, and the suite has to prove it is stable before it runs
# on every PR. Persona credentials and the UAT frontend URL come from the `uat` GitHub
# environment; a persona without secrets is skipped, not failed.
name: E2E (UAT)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "all = the browser tests; perf = only the PPDO-257 performance measurement (sizes, times, throttled pass)"
        type: choice
        options: [all, perf]
        default: all
      bulk_export:
        description: "perf only: also time the bulk WFP export. It writes one export job row on UAT."
        type: boolean
        default: false

jobs:
  e2e:
    name: Playwright against UAT
    runs-on: ubuntu-latest
    environment: uat

    defaults:
      run:
        working-directory: frontend

    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SA_EMAIL: ${{ secrets.E2E_SA_EMAIL }}
      E2E_SA_PASSWORD: ${{ secrets.E2E_SA_PASSWORD }}
      E2E_AD_EMAIL: ${{ secrets.E2E_AD_EMAIL }}
      E2E_AD_PASSWORD: ${{ secrets.E2E_AD_PASSWORD }}
      E2E_RV_EMAIL: ${{ secrets.E2E_RV_EMAIL }}
      E2E_RV_PASSWORD: ${{ secrets.E2E_RV_PASSWORD }}
      E2E_ST_EMAIL: ${{ secrets.E2E_ST_EMAIL }}
      E2E_ST_PASSWORD: ${{ secrets.E2E_ST_PASSWORD }}
      E2E_EN_EMAIL: ${{ secrets.E2E_EN_EMAIL }}
      E2E_EN_PASSWORD: ${{ secrets.E2E_EN_PASSWORD }}
      E2E_XD_EMAIL: ${{ secrets.E2E_XD_EMAIL }}
      E2E_XD_PASSWORD: ${{ secrets.E2E_XD_PASSWORD }}
      # Journeys (PPDO-259): the seed Admin builds the E2E office and inventory division through the
      # API, so it also needs the Function App's /api URL. Without the seed secrets the journeys are
      # skipped. The seed Admin must hold no cross-office review grant and must not be a persona.
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_SEED_EMAIL: ${{ secrets.E2E_SEED_EMAIL }}
      E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
      # UAT is shared: always take the E2E office back out of the consolidated AIP afterwards.
      E2E_AIP_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: inputs.suite != 'perf'
        run: npm run e2e:uat

      # PPDO-257: a measuring tool, not a test. It records numbers and does not fail on a slow page.
      # Signs in as the SA persona (AD if there is no SA secret). Read-only, except the bulk export.
      - name: Run performance measurement
        if: inputs.suite == 'perf'
        env:
          E2E_PERF_BULK_EXPORT: ${{ inputs.bulk_export && '1' || '0' }}
        run: npm run e2e:perf

      - name: Upload performance results
        if: inputs.suite == 'perf' && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: frontend/e2e-results/perf/
          retention-days: 14

      - name: Upload HTML report
        if: inputs.suite != 'perf' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
