# Browser tests against UAT (PPDO-258).
#
# Manual only, on purpose: UAT is shared, and the suite has to prove it is stable before it runs
# on every PR. Persona credentials and the UAT frontend URL come from the `uat` GitHub
# environment; a persona without secrets is skipped, not failed.
name: E2E (UAT)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright against UAT
    runs-on: ubuntu-latest
    environment: uat

    defaults:
      run:
        working-directory: frontend

    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SA_EMAIL: ${{ secrets.E2E_SA_EMAIL }}
      E2E_SA_PASSWORD: ${{ secrets.E2E_SA_PASSWORD }}
      E2E_AD_EMAIL: ${{ secrets.E2E_AD_EMAIL }}
      E2E_AD_PASSWORD: ${{ secrets.E2E_AD_PASSWORD }}
      E2E_RV_EMAIL: ${{ secrets.E2E_RV_EMAIL }}
      E2E_RV_PASSWORD: ${{ secrets.E2E_RV_PASSWORD }}
      E2E_ST_EMAIL: ${{ secrets.E2E_ST_EMAIL }}
      E2E_ST_PASSWORD: ${{ secrets.E2E_ST_PASSWORD }}
      E2E_EN_EMAIL: ${{ secrets.E2E_EN_EMAIL }}
      E2E_EN_PASSWORD: ${{ secrets.E2E_EN_PASSWORD }}
      E2E_XD_EMAIL: ${{ secrets.E2E_XD_EMAIL }}
      E2E_XD_PASSWORD: ${{ secrets.E2E_XD_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run e2e:uat

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
